<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio de Brownies</title>
<style>
/* ===== CORES (edite aqui) ===== */
:root{
  --primaria:#6B3019; --primaria-escura:#4A2010; --destaque:#E3A92A; --suave:#FBF19A;
  --fundo:#FFF9DE; --card:#FFFFFF; --texto:#2B1810; --texto2:#7A6455; --borda:#F0E4B4;
  --ac-texto:#6B3019;
  --sombra:0 4px 16px rgba(74,32,16,.10);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primaria:#8A4524; --fundo:#1E100A; --card:#2B1A12; --texto:#FBEFD5; --texto2:#CDB79A; --borda:#4A3126; --suave:#3A2418; --ac-texto:#E3A92A;
    --sombra:0 4px 16px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primaria:#8A4524; --fundo:#1E100A; --card:#2B1A12; --texto:#FBEFD5; --texto2:#CDB79A; --borda:#4A3126; --suave:#3A2418; --ac-texto:#E3A92A;
  --sombra:0 4px 16px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--fundo);color:var(--texto);font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--destaque);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 16px 120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* cabeçalho */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
.marca{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ac-texto)}
.marca small{display:block;font-size:11px;font-weight:500;color:var(--texto2);letter-spacing:0}
.btn-sacola{position:relative;width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--sombra);display:grid;place-items:center}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--primaria);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.badge[hidden]{display:none}
svg{display:block}

/* boas-vindas */
.hero{position:relative;margin-top:8px;border-radius:24px;overflow:hidden;background:#FBF19A;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:230px}
.hero-t{padding:20px 0 20px 20px}
.hero h1{color:#2B1810;font-size:24px;line-height:1.12;letter-spacing:-.02em}
.hero p{margin:8px 0 14px;color:#6B5545;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:22px;background:var(--primaria);color:#fff;font-weight:600;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--primaria-escura)}
.hero .ph{height:100%;min-height:230px;border-radius:0;background:#FBF19A}
.hero .ph img{object-position:center 25%}

/* placeholder de foto */
.ph{background:linear-gradient(135deg,var(--suave),var(--destaque));display:grid;place-items:center;color:#fff;overflow:hidden;position:relative}
.ph span{font-size:10px;font-weight:600;color:var(--primaria-escura);background:rgba(255,255,255,.75);padding:2px 8px;border-radius:10px}
.prod .ph img{object-fit:contain;padding:6px}
.ph img,img.foto{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}

/* busca */
.busca{position:relative;margin:16px 0 12px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--texto2)}
.busca input{width:100%;height:48px;border-radius:16px;border:1px solid var(--borda);background:var(--card);padding:0 44px;outline:none}
.busca input:focus{border-color:var(--primaria)}
.busca .x{position:absolute;right:4px;top:2px;width:44px;height:44px;color:var(--texto2);font-size:20px}

/* banner */
.banner{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,var(--primaria-escura),var(--primaria));color:#fff;margin:0;flex:0 0 100%;scroll-snap-align:start}
.banner-t{padding:16px}
.banner h2{font-size:17px;line-height:1.2}
.banner p{font-size:12.5px;opacity:.85;margin-top:4px}
.banner .btn{background:#fff;color:var(--primaria-escura);min-height:44px;padding:0 16px;font-size:13.5px;margin-top:10px}
.banner .ph{border-radius:0;min-height:160px}

.carrossel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;scrollbar-width:none;margin-top:6px;overscroll-behavior-x:contain}
.carrossel::-webkit-scrollbar{display:none}
.banner.contain .ph{background:rgba(255,255,255,.1)}
.banner.contain .ph img{object-fit:contain;padding:10px}
.pontos{display:flex;justify-content:center;margin-top:2px}
.pontos button{width:40px;height:32px;display:grid;place-items:center}
.pontos button::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--borda);transition:.2s}
.pontos button[aria-current="true"]::before{width:20px;background:var(--primaria)}
.topo-s{display:flex;align-items:center;gap:10px;padding:16px 0 12px}
.voltar{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--sombra);display:grid;place-items:center;flex:0 0 auto}
h1.tit{font-size:20px;letter-spacing:-.01em}
h1.tit:focus{outline:none}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--card);border-radius:20px;box-shadow:var(--sombra);padding:10px;position:relative}
.item .ph{width:76px;height:76px;border-radius:14px}
.item .ph img{object-fit:contain;padding:5px}
.item h4{font-size:14.5px;line-height:1.25;padding-right:34px}
.item .un{font-size:12.5px;color:var(--texto2);margin-top:2px}
.item-b{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.rem{position:absolute;top:0;right:0;width:44px;height:44px;color:var(--texto2);font-size:22px;line-height:1}
.resumo{background:var(--card);border-radius:20px;box-shadow:var(--sombra);padding:16px;margin-top:14px;display:grid;gap:8px}
.linha{display:flex;justify-content:space-between;gap:12px;color:var(--texto2)}
.linha.total{color:var(--texto);font-weight:800;font-size:18px;border-top:1px solid var(--borda);padding-top:10px;margin-top:2px}
.btn.bloco{width:100%;margin-top:12px;min-height:50px;border-radius:25px}
.btn.sec{background:var(--card);color:var(--ac-texto);border:1.5px solid var(--primaria)}
.btn.sec:hover{background:var(--suave)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.opcao{background:var(--card);border-radius:20px;box-shadow:var(--sombra);border:2px solid transparent;margin-top:12px;overflow:hidden;transition:border-color .15s}
.opcao.sel{border-color:var(--primaria)}
.opcao.off{opacity:.6;background:var(--suave);box-shadow:none}
.op-btn,.op-off{display:grid;grid-template-columns:48px 1fr 24px;gap:12px;align-items:center;width:100%;text-align:left;padding:14px}
.op-ic{width:48px;height:48px;border-radius:14px;background:var(--primaria);color:#fff;display:grid;place-items:center}
.off .op-ic{background:var(--borda);color:var(--texto2)}
.op-t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.op-d{font-size:13px;color:var(--texto2);margin-top:2px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--suave);color:var(--ac-texto);border:1px solid var(--borda)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--borda);display:grid;place-items:center;color:transparent}
.sel .radio{background:var(--primaria);border-color:var(--primaria);color:#fff}
.op-extra{padding:0 14px 14px}
.end{display:flex;gap:10px;align-items:flex-start;background:var(--fundo);border-radius:14px;padding:12px;font-size:13.5px}
.end svg{flex:0 0 auto;color:var(--ac-texto);margin-top:2px}
.end small{display:block;color:var(--texto2);font-size:12px}
.end p+p{margin-top:4px}
.hor{margin-top:6px}
.hor summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--ac-texto)}
.hor div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--texto2);font-size:13px}
.hor .hoje{color:var(--texto);font-weight:700}
.end a{color:var(--ac-texto);font-weight:600;text-decoration:underline;display:inline-block;padding:4px 0}
.campo{display:block;margin-top:12px;font-size:13.5px;font-weight:600}
.campo textarea{display:block;width:100%;margin-top:6px;min-height:76px;border-radius:14px;border:1px solid var(--borda);background:var(--card);padding:10px 12px;resize:vertical;font-weight:400;outline:none}
.campo textarea:focus{border-color:var(--primaria)}
.erro{color:#B3261E;font-size:13.5px;margin-top:12px;display:flex;gap:6px;align-items:center}
:root[data-theme="dark"] .erro{color:#FFB4AB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .erro{color:#FFB4AB}}
.in{display:block;width:100%;height:48px;border-radius:14px;border:1px solid var(--borda);background:var(--card);padding:0 14px;outline:none}
.in:focus{border-color:var(--primaria)}
.in[aria-invalid="true"]{border-color:#B3261E}
.rotulo{display:block;margin-top:14px;margin-bottom:6px;font-size:13.5px;font-weight:600}
.erro.f{margin-top:6px}
.erro[hidden]{display:none}
.aviso{background:var(--card);border:1.5px solid var(--primaria);border-radius:16px;padding:14px;margin-top:14px;font-size:14px}
.aviso[hidden]{display:none}
.aviso a{color:var(--ac-texto);font-weight:600;text-decoration:underline;display:inline-block;padding:6px 0}
.ilus{display:grid;place-items:center;margin:0 0 6px;color:var(--ac-texto)}
h2.quase{text-align:center;font-size:24px;letter-spacing:-.01em}
p.sub{text-align:center;color:var(--texto2);margin-top:4px}
h3.sec{font-size:17px;margin:18px 0 10px;letter-spacing:-.01em}

/* produtos */
.lista{display:grid;gap:12px}
.prod{display:grid;grid-template-columns:104px 1fr;gap:12px;background:var(--card);border-radius:20px;box-shadow:var(--sombra);padding:10px}
.prod .ph{width:104px;height:104px;border-radius:14px}
.prod-i{display:flex;flex-direction:column;min-width:0}
.prod h4{font-size:15px;line-height:1.25}
.prod p{font-size:12.5px;color:var(--texto2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-b{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.preco{font-weight:800;color:var(--ac-texto)}
.add{width:44px;height:44px;margin:-6px -4px -6px 0;display:grid;place-items:center}
.add b{width:36px;height:36px;border-radius:50%;background:var(--primaria);color:#fff;display:grid;place-items:center}
.step{display:flex;align-items:center;gap:2px}
.step button{width:40px;height:40px;display:grid;place-items:center}
.step button b{width:32px;height:32px;border-radius:50%;border:1px solid var(--borda);background:var(--card);display:grid;place-items:center;font-size:18px;line-height:1}
.step button.mais b{background:var(--primaria);border-color:var(--primaria);color:#fff}
.step output{min-width:20px;text-align:center;font-weight:700}

/* vazio */
.vazio{text-align:center;padding:40px 16px;color:var(--texto2)}
.vazio h4{color:var(--texto);font-size:16px;margin-bottom:4px}
.vazio .btn{margin-top:14px}

/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--borda);box-shadow:0 -6px 20px rgba(74,32,16,.10);z-index:20}
.barra[hidden]{display:none}
.teclado .barra{display:none}
.barra-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra-ic{width:40px;height:40px;border-radius:12px;background:var(--suave);color:var(--ac-texto);display:grid;place-items:center;flex:0 0 auto}
.barra-t{flex:1;min-width:0;font-size:12px;color:var(--texto2)}
.barra-t strong{display:block;font-size:15px;color:var(--texto)}
.barra .btn{flex:0 0 auto}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<div id="vCardapio">
  <header>
    <div class="marca" id="marca"></div>
    <button class="btn-sacola" id="btnTopo" aria-label="Abrir sacola">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge" id="badgeTopo" hidden>0</span>
    </button>
  </header>

  <section class="hero" id="hero">
    <div class="hero-t">
      <h1 id="heroTitulo"></h1>
      <p id="heroTexto"></p>
      <a class="btn" href="#produtos">Ver cardápio</a>
    </div>
    <div class="ph" id="heroFoto"></div>
  </section>

  <div class="busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <label class="sr" for="q">Buscar brownies</label>
    <input id="q" type="search" placeholder="Buscar brownies..." autocomplete="off" enterkeyhint="search">
    <button class="x" id="limpaX" aria-label="Limpar busca" hidden>×</button>
  </div>
  <div id="bannerBox"></div>

  <h3 class="sec" id="produtos">Cardápio</h3>
  <div class="lista" id="lista" aria-live="polite"></div>
</div>
<div id="vSacola" hidden></div>
<div id="vReceb" hidden></div>
<div id="vFinal" hidden></div>
</div>

<div class="barra" id="barra" hidden>
  <div class="barra-in">
    <div class="barra-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></div>
    <div class="barra-t"><span id="barraQtd"></span><strong id="barraTotal"></strong></div>
    <button class="btn" id="btnVer">Ver sacola</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="loja-config.js"></script>

/* ===== ESTADO ===== */
let BANNERS_ATIVOS = [];
const state = { nome: "", tel: "", obsFinal: "", receb: null, obs: "", erroReceb: false, tela: "cardapio", cat: "todos", busca: "", sacola: {} }; // sacola: { idProduto: quantidade }
const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const foto = (src, rotulo) => src ? `<img src="${esc(src)}" alt="${esc(rotulo||"")}">` : `<span>foto</span>`;

const totais = () => {
  let un = 0, total = 0;
  for (const p of CONFIG.produtos) { const q = state.sacola[p.id] || 0; un += q; total += q * p.preco; }
  return { un, total: Math.round(total * 100) / 100 };
};

/* ===== AÇÕES ===== */
const CHAVE = "mivbrownie_sacola";
function salvar() { try { sessionStorage.setItem(CHAVE, JSON.stringify(state.sacola)); } catch (e) {} }
function carregar() {
  try {
    const o = JSON.parse(sessionStorage.getItem(CHAVE) || "{}");
    for (const [id, q] of Object.entries(o))
      if (CONFIG.produtos.some(p => String(p.id) === id) && Number.isInteger(q) && q > 0 && q < 100) state.sacola[id] = q;
  } catch (e) {}
}
function setQtd(id, q) {
  q = Math.min(99, Math.max(0, Math.floor(q)));   // nunca negativo, máximo 99
  if (q === 0) delete state.sacola[id]; else state.sacola[id] = q;
  salvar();
  const ae = document.activeElement;
  const sel = ae && ae.dataset && (ae.dataset.mais ? `[data-mais="${ae.dataset.mais}"]` : ae.dataset.menos ? `[data-menos="${ae.dataset.menos}"]` : null);
  renderLista(); renderBarra();
  if (state.tela === "sacola") {
    renderSacola();
    const el = sel && $("vSacola").querySelector(sel);
    if (el) el.focus();
  }
}
function avisar(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(avisar.t); avisar.t = setTimeout(() => t.classList.remove("on"), 1800);
}

$("vFinal").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-voltar")) setTela("recebimento");
  else if (t.hasAttribute("data-enviar")) finalizar();
  else if (t.hasAttribute("data-copiar")) copiarMensagem();
});
$("vFinal").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "nome") state.nome = el.value;
  else if (el.id === "obsf") state.obsFinal = el.value;
  else if (el.id === "tel") { el.value = state.tel = mascaraTel(el.value); }
  if (el.id === "nome" || el.id === "tel") { el.setAttribute("aria-invalid", "false"); const m = $("e-" + el.id); if (m) m.hidden = true; }
});
/* ===== DADOS DO PAINEL DA VENDEDORA ===== */
function aplicarDados(d) {
  if (!d || typeof d !== "object") return;
  if (Array.isArray(d.produtos)) CONFIG.produtos = d.produtos;
  if (Array.isArray(d.banners)) CONFIG.banners = d.banners;
  if (d.retirada) CONFIG.retirada = d.retirada;
  if (d.marca) CONFIG.marca = d.marca;
  for (const id of Object.keys(state.sacola)) {            // tira da sacola o que saiu do cardápio
    const p = CONFIG.produtos.find(x => String(x.id) === id);
    if (!p || p.ativo === false) delete state.sacola[id];
  }
  salvar(); renderFixos(); renderLista(); renderBarra();
  if (state.tela === "sacola") renderSacola();
  if (state.tela === "recebimento") renderReceb();
}
async function carregarRemoto() {
  const L = window.LOJA;
  if (!L || !L.url || !L.anonKey) {                        // sem servidor: só usa o modo demonstração do painel
    try { const d = localStorage.getItem("mivbrownie_demo"); if (d) aplicarDados(JSON.parse(d)); } catch (e) {}
    return;
  }
  try { const c = localStorage.getItem("mivbrownie_dados"); if (c) aplicarDados(JSON.parse(c)); } catch (e) {}
  try {
    const r = await fetch(`${L.url}/rest/v1/cardapio?id=eq.1&select=dados`, { headers: { apikey: L.anonKey, Authorization: "Bearer " + L.anonKey } });
    if (!r.ok) return;
    const rows = await r.json();
    if (rows[0] && rows[0].dados) {
      aplicarDados(rows[0].dados);
      try { localStorage.setItem("mivbrownie_dados", JSON.stringify(rows[0].dados)); } catch (e) {}
    }
  } catch (e) {}
}
window.addEventListener("popstate", e => setTela((e.state && e.state.t) || "cardapio", false));
try { history.replaceState({ t: "cardapio" }, ""); } catch (e) {}
carregar();
renderFixos(); renderLista(); renderBarra();
carregarRemoto();
</script>
