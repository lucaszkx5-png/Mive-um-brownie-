<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tropa do Barbeiro</title><style>
:root{--bg:#0c0d0e;--card:#17191b;--gold:#d7aa57;--txt:#f6f2eb;--muted:#b4b0a8;--line:#343638}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px 60px}header{text-align:center;padding:28px 8px 34px;border-bottom:1px solid var(--line)}.mark{color:var(--gold);font-size:12px;letter-spacing:.28em;text-transform:uppercase}h1{font-size:clamp(30px,7vw,48px);margin:8px 0}h2{font-size:21px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}.field{display:block;margin:12px 0 5px;color:var(--muted);font-size:14px}input,select,button{width:100%;min-height:46px;border-radius:10px;border:1px solid #484a4b;padding:10px 12px;background:#101112;color:var(--txt);font:inherit}button{background:var(--gold);color:#17130c;border:0;font-weight:750;cursor:pointer;margin-top:12px}button:disabled{opacity:.45;cursor:not-allowed}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:10px}.slots button{margin:0;background:#222426;color:var(--txt);border:1px solid #444}.slots button.selected{background:var(--gold);color:#17130c}.notice{margin-top:12px;padding:12px;border-radius:10px;background:#24201a;color:var(--gold);display:none}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.links a{color:var(--gold)}small{color:var(--muted)}footer{text-align:center;margin-top:28px;color:var(--muted);font-size:13px}</style></head><body><main><header><div class="mark">Estilo • Precisão • Atitude</div><h1>Tropa do Barbeiro</h1><p class="muted">Escolha seu serviço e reserve seu horário.</p></header><section class="card"><h2>Agende seu horário</h2><p class="muted" id="state">Carregando serviços e disponibilidade…</p><label class="field" for="service">Serviço</label><select id="service"><option value="">Selecione um serviço</option></select><label class="field" for="date">Dia</label><input id="date" type="date"><div class="field">Horários disponíveis</div><div id="slots" class="slots"></div><label class="field" for="name">Seu nome</label><input id="name" maxlength="100" autocomplete="name" placeholder="Nome completo"><label class="field" for="phone">WhatsApp</label><input id="phone" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(81) 99999-9999"><button id="submit" disabled>Confirmar agendamento</button><div id="notice" class="notice" role="status"></div></section><div class="links"><a href="/agendamentos.html">Painel de agendamentos</a><a href="/admin.html">Administração</a></div><footer>© Tropa do Barbeiro</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://zkkicmgrjoroemuvkcgr.supabase.co', KEY='sb_publishable_v523WJVV3PgQa1UoBZyp7g_Y5dVZhXF';const db=window.supabase.createClient(URL,KEY);let services=[],settings=null,selectedSlot=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function msg(t){$('notice').style.display='block';$('notice').textContent=t}function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dateIso(date,time){return new Date(date+'T'+time+':00-03:00').toISOString()}
async function init(){const {data:s,error:e}=await db.from('business_settings').select('*').eq('id',1).single();if(e){$('state').textContent='Não foi possível carregar as configurações. Tente novamente mais tarde.';return}settings=s;const {data,error}=await db.from('services').select('id,name,description,price_brl,duration_minutes,active').eq('active',true).order('sort_order');if(error){$('state').textContent='Erro ao carregar os serviços.';return}services=data||[];$('service').innerHTML='<option value="">Selecione um serviço</option>'+services.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' — '+money(s.price_brl)+' ('+s.duration_minutes+' min)</option>').join('');const today=localDate(new Date());$('date').min=today;$('date').value=today;$('state').textContent=settings.booking_enabled?'Escolha o serviço, o dia e um horário livre.':'A agenda está temporariamente fechada para configuração. Você poderá consultar os serviços, mas ainda não reservar.';$('submit').disabled=!settings.booking_enabled;await loadSlots()}
async function loadSlots(){selectedSlot=null;$('slots').innerHTML='';$('submit').disabled=!settings?.booking_enabled||!$('service').value||true;if(!settings||!$('date').value)return;const day=new Date($('date').value+'T12:00:00').getDay();if(!settings.open_days?.includes(day)){ $('slots').innerHTML='<p class="muted">A barbearia não atende neste dia.</p>';return}if(!settings.booking_enabled){$('slots').innerHTML='<p class="muted">Agendamentos ainda não liberados.</p>';return}const {data:busy,error}=await db.rpc('get_busy_slots',{p_date:$('date').value});if(error){$('slots').innerHTML='<p class="muted">Não foi possível consultar os horários.</p>';return}const svc=services.find(s=>s.id===$('service').value);const duration=svc?.duration_minutes||settings.slot_interval_minutes;const starts=[];let t=settings.opening_time.slice(0,5),end=settings.closing_time.slice(0,5);const mins=x=>{let [h,m]=x.split(':').map(Number);return h*60+m},fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');for(let n=mins(t);n+duration<=mins(end);n+=settings.slot_interval_minutes){const time=fmt(n),start=dateIso($('date').value,time),finish=new Date(new Date(start).getTime()+duration*60000);if(new Date(start)<=new Date())continue;const overlap=(busy||[]).some(b=>new Date(b.busy_start_at)<finish&&new Date(b.busy_end_at)>new Date(start));if(!overlap)starts.push(time)}if(!starts.length){$('slots').innerHTML='<p class="muted">Não há horários disponíveis nesse dia.</p>';return}starts.forEach(time=>{const b=document.createElement('button');b.type='button';b.textContent=time;b.onclick=()=>{selectedSlot=time;document.querySelectorAll('#slots button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('submit').disabled=false};$('slots').appendChild(b)})}
$('service').addEventListener('change',loadSlots);$('date').addEventListener('change',loadSlots);$('submit').addEventListener('click',async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim(),service=services.find(s=>s.id===$('service').value);if(!name||name.length<2||!phone||phone.replace(/\D/g,'').length<10||!service||!selectedSlot){msg('Preencha nome, WhatsApp, serviço e escolha um horário.');return}const start=dateIso($('date').value,selectedSlot);$('submit').disabled=true;$('submit').textContent='Confirmando…';const {data,error}=await db.rpc('create_appointment',{p_customer_name:name,p_customer_phone:phone,p_service_id:service.id,p_start_at:start});$('submit').textContent='Confirmar agendamento';if(error){msg(error.message||'Não foi possível reservar. Escolha outro horário.');await loadSlots();return}msg('Agendamento solicitado com sucesso! Guarde esta confirmação: '+data+'.');selectedSlot=null;await loadSlots()});init();
</script></body></html>
