<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Tropa do Barbeiro</title><style>
body{margin:0;background:#0c0d0e;color:#f6f2eb;font:16px system-ui}main{max-width:800px;margin:auto;padding:24px 16px}h1,h2{color:#d7aa57}.card{background:#17191b;border:1px solid #343638;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 5px;color:#b4b0a8}input,select,button{width:100%;box-sizing:border-box;min-height:44px;border-radius:9px;border:1px solid #484a4b;padding:10px;background:#101112;color:#fff;font:inherit}button{background:#d7aa57;color:#17130c;border:0;font-weight:700;margin-top:10px;cursor:pointer}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.days{display:flex;flex-wrap:wrap;gap:12px}.days label{display:flex;align-items:center;gap:5px}.days input{width:auto;min-height:auto}.muted{color:#b4b0a8}.hidden{display:none}.service{border-top:1px solid #343638;padding:12px 0}.notice{padding:12px;background:#24201a;color:#d7aa57;border-radius:9px;margin-top:10px}@media(max-width:540px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>Administração</h1><p class="muted">Edite serviços, preços e funcionamento do site. A agenda dos clientes fica em outro painel.</p><section class="card" id="login"><h2>Entrar</h2><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="signin">Entrar no painel</button><div id="loginmsg" class="notice hidden"></div></section><div id="app" class="hidden"><section class="card"><h2>Informações básicas</h2><label>Nome exibido</label><input id="business"><label>Hora de abertura</label><input id="open" type="time"><label>Hora de fechamento</label><input id="close" type="time"><label>Intervalo entre inícios de horários (minutos)</label><input id="interval" type="number" min="5" max="240" step="5"><label>Dias de atendimento</label><div class="days" id="days"></div><label><input id="enabled" type="checkbox" style="width:auto;min-height:auto"> Liberar agendamentos para clientes</label><button id="saveSettings">Salvar funcionamento</button></section><section class="card"><h2>Serviços e preços</h2><div id="services"></div><h3>Adicionar serviço</h3><label>Nome</label><input id="newName"><label>Preço (R$)</label><input id="newPrice" type="number" min="0" step=".01"><label>Duração (minutos)</label><input id="newDuration" type="number" min="5" max="480" value="30"><button id="addService">Adicionar serviço</button><div id="notice" class="notice hidden"></div></section><button id="signout">Sair</button></div><p><a href="/" style="color:#d7aa57">Voltar ao site</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://zkkicmgrjoroemuvkcgr.supabase.co','sb_publishable_v523WJVV3PgQa1UoBZyp7g_Y5dVZhXF');const $=id=>document.getElementById(id);let services=[];const daysNames=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];function notice(t){$('notice').classList.remove('hidden');$('notice').textContent=t}function loginmsg(t){$('loginmsg').classList.remove('hidden');$('loginmsg').textContent=t}function money(n){return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function isAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('app_admins').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
async function enter(){if(!(await isAdmin())){loginmsg('Esta conta ainda não está autorizada como administradora. Peça para vincular o usuário no Supabase; não compartilhe sua senha.');await db.auth.signOut();return} $('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
async function load(){const {data:s,error}=await db.from('business_settings').select('*').eq('id',1).single();if(error){notice('Erro ao carregar configurações: '+error.message);return}$('business').value=s.business_name;$('open').value=s.opening_time?.slice(0,5)||'10:00';$('close').value=s.closing_time?.slice(0,5)||'18:00';$('interval').value=s.slot_interval_minutes||30;$('enabled').checked=s.booking_enabled;$('days').innerHTML=daysNames.map((n,i)=>'<label><input type="checkbox" value="'+i+'" '+((s.open_days||[]).includes(i)?'checked':'')+'>'+n+'</label>').join('');const {data,error:e}=await db.from('services').select('*').order('sort_order');if(e){notice('Erro ao carregar serviços: '+e.message);return}services=data||[];renderServices()}
function renderServices(){$('services').innerHTML=services.map(s=>'<div class="service" data-id="'+s.id+'"><label>Nome</label><input data-field="name" value="'+String(s.name).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"><div class="row"><div><label>Preço (R$)</label><input data-field="price_brl" type="number" min="0" step=".01" value="'+s.price_brl+'"></div><div><label>Duração (min)</label><input data-field="duration_minutes" type="number" min="5" max="480" value="'+s.duration_minutes+'"></div><div><label>Visível</label><select data-field="active"><option value="true" '+(s.active?'selected':'')+'>Sim</option><option value="false" '+(!s.active?'selected':'')+'>Não</option></select></div></div><button data-save="'+s.id+'">Salvar serviço</button></div>').join('');$('services').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveService(b.dataset.save))}
async function saveService(id){const wrap=$('services').querySelector('[data-id="'+id+'"]');const payload={};wrap.querySelectorAll('[data-field]').forEach(el=>payload[el.dataset.field]=el.dataset.field==='active'?el.value==='true':el.dataset.field==='price_brl'||el.dataset.field==='duration_minutes'?Number(el.value):el.value.trim());const {error}=await db.from('services').update(payload).eq('id',id);if(error){notice('Não foi possível salvar serviço: '+error.message);return}notice('Serviço salvo.');await load()}
$('saveSettings').onclick=async()=>{const open=$('open').value,close=$('close').value,interval=Number($('interval').value),open_days=[...$('days').querySelectorAll('input:checked')].map(x=>Number(x.value));if(!open||!close||open>=close||interval<5||interval>240||!open_days.length){notice('Confira horários, intervalo e ao menos um dia de atendimento.');return}const {error}=await db.from('business_settings').update({business_name:$('business').value.trim()||'Tropa do Barbeiro',opening_time:open,closing_time:close,slot_interval_minutes:interval,open_days,booking_enabled:$('enabled').checked,updated_at:new Date().toISOString()}).eq('id',1);notice(error?'Erro ao salvar: '+error.message:'Funcionamento salvo.');}
$('addService').onclick=async()=>{const name=$('newName').value.trim(),price=Number($('newPrice').value),duration=Number($('newDuration').value);if(!name||price<0||duration<5||duration>480){notice('Preencha nome, preço e duração válidos.');return}const {error}=await db.from('services').insert({name,price_brl:price,duration_minutes:duration,active:true,sort_order:services.length+1});if(error){notice('Erro ao adicionar: '+error.message);return}$('newName').value='';$('newPrice').value='';notice('Serviço adicionado.');await load()};
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){loginmsg('Falha no login: '+error.message);return}await enter()};$('signout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data})=>{if(data.session)enter()});
</script></body></html>
