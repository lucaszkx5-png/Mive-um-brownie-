<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendamentos — Tropa do Barbeiro</title><style>body{margin:0;background:#0c0d0e;color:#f6f2eb;font:16px system-ui}main{max-width:900px;margin:auto;padding:24px 16px}h1{color:#d7aa57}.card{background:#17191b;border:1px solid #343638;border-radius:16px;padding:18px;margin:16px 0}input,button{min-height:44px;border-radius:9px;border:1px solid #484a4b;padding:10px;background:#101112;color:#fff;font:inherit}button{background:#d7aa57;color:#17130c;border:0;font-weight:700;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters>*{flex:1;min-width:150px}.muted{color:#b4b0a8}.item{border-top:1px solid #343638;padding:14px 0}.tag{color:#d7aa57}a{color:#d7aa57}.hidden{display:none}</style></head><body><main><h1>Painel de agendamentos</h1><p class="muted">Somente consulta: este painel não permite alterar nem cancelar reservas.</p><section class="card" id="login"><label>E-mail <input id="email" type="email" autocomplete="username"></label><p><label>Senha <input id="password" type="password" autocomplete="current-password"></label></p><button id="signin">Entrar</button><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><div class="filters"><input id="date" type="date"><button id="refresh">Atualizar lista</button></div><div id="list"></div></div><button id="signout">Sair</button></section><p><a href="/">Voltar ao site</a> · <a href="/admin.html">Administração</a></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://zkkicmgrjoroemuvkcgr.supabase.co','sb_publishable_v523WJVV3PgQa1UoBZyp7g_Y5dVZhXF');const $=id=>document.getElementById(id);function day(d){return new Date(d).toLocaleString('pt-BR',{timeZone:'America/Recife',dateStyle:'short',timeStyle:'short'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function enter(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){$('msg').textContent='Conta sem permissão administrativa.';await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=new Date().toLocaleDateString('en-CA',{timeZone:'America/Recife'});await load()}
async function load(){const date=$('date').value;if(!date)return;$('list').textContent='Carregando…';const start=new Date(date+'T00:00:00-03:00').toISOString(),end=new Date(new Date(date+'T00:00:00-03:00').getTime()+86400000).toISOString();const {data,error}=await db.from('appointments').select('id,customer_name,customer_phone,start_at,end_at,status,customer_note,services(name,price_brl)').gte('start_at',start).lt('start_at',end).order('start_at');if(error){$('list').textContent='Erro ao consultar: '+error.message;return}if(!data?.length){$('list').innerHTML='<p class="muted">Nenhum agendamento nesta data.</p>';return}$('list').innerHTML=data.map(a=>'<article class="item"><strong>'+day(a.start_at)+'</strong> <span class="tag">'+esc(a.status)+'</span><p>'+esc(a.customer_name)+' · '+esc(a.customer_phone)+'</p><p>'+esc(a.services?.name||'Serviço')+' · '+Number(a.services?.price_brl||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+'</p>'+(a.customer_note?'<p class="muted">'+esc(a.customer_note)+'</p>':'')+'</article>').join('')}
$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('msg').textContent='Falha no login: '+error.message;return}await enter()};$('refresh').onclick=load;$('date').onchange=load;$('signout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data})=>{if(data.session)enter()});
</script></body></html>
